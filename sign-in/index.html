<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Risk Finder - Sign In</title>
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="styleguide.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="sign-in">
      <div class="frame">
        <header class="logo">
          <div class="icon" role="img" aria-label="Risk Finde Logo">
            <img class="stroke" src="img/image.svg" alt="" />
            <img class="img" src="img/stroke.svg" alt="" />
            <img class="stroke-2" src="img/stroke-2.svg" alt="" />
          </div>
          <div class="text-wrapper">Risk Finder</div>
        </header>
        <div class="cards">
          <section class="card">
            <div class="top">
              <h1 class="text"><span class="div">Sign In</span></h1>
            </div>
            <div class="div-wrapper">
              <input type="text" id="username" name="username" class="input-field" aria-label="Username" required placeholder=" " />
              <label for="username_in" class="text-wrapper2">Username</label>
            </div>
            <div class="div-wrapper">
              <input type="password" id="password" name="password" class="input-field" aria-label="Password" required placeholder=" " />
              <label for="password_in" class="text-wrapper3">Password</label>
            </div>
            <div class="frame-2">
              <a href="#" class="text-wrapper-4">Forgot password?</a>
              <button type="submit" class="frame-3"><span class="text-wrapper-5">Log In</span></button>
            </div>
          </section>

          <img class="divider" src="img/divider.svg" alt="" role="presentation" />

          <section class="card-2">
            <div class="frame-4">
              <p class="text-wrapper-6">Don’t have an account?</div>
              <a href="#" class="frame-5"><span class="text-wrapper-7">Sign Up</span></a>
            </section>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
